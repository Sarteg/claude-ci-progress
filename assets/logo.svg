<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ci-progress logo: three runner progress bars">
  <rect width="256" height="256" rx="56" fill="#161b22"/>

  <!-- runner 1: running, pulsing yellow dot -->
  <circle cx="58" cy="87" r="13" fill="#f2c94c" opacity="0.3">
    <animate attributeName="r" values="9;15;9" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.1;0.55" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="58" cy="87" r="8" fill="#f2c94c"/>
  <rect x="86" y="77" width="124" height="20" rx="10" fill="#30363d"/>
  <rect x="86" y="77" width="100" height="20" rx="10" fill="#f2c94c"/>

  <!-- runner 2: running -->
  <circle cx="58" cy="128" r="8" fill="#f2c94c"/>
  <rect x="86" y="118" width="124" height="20" rx="10" fill="#30363d"/>
  <rect x="86" y="118" width="58" height="20" rx="10" fill="#f2c94c"/>

  <!-- runner 3: online, waiting for jobs -->
  <circle cx="58" cy="169" r="8" fill="#3fb950"/>
  <rect x="86" y="159" width="124" height="20" rx="10" fill="#30363d"/>
</svg>
